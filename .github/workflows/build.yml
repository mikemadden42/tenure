name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v5
      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
        continue-on-error: ${{ matrix.toolchain != 'stable' }}
      - name: Run tests
        run: cargo test --verbose
        continue-on-error: ${{ matrix.toolchain != 'stable' }}

  msrv:
    name: msrv (ubuntu-latest, 1.62)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install 1.62 toolchain
        uses: dtolnay/rust-toolchain@1.62
      - uses: Swatinem/rust-cache@v2
      # Cargo.lock uses lockfile v4, which cargo 1.62 can't read; resolve fresh.
      - name: Check
        run: |
          rm Cargo.lock
          cargo check --verbose

  clippy:
    name: clippy (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: fmt (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check
